# ============================================================
#  tmux.conf — youhide
#  Dracula minimal · true color · nvim-friendly
# ============================================================

# ---------- Terminal & shell ----------
set-option -g default-command $SHELL
set-option -g default-shell $SHELL

# True color. Without these the Dracula palette degrades to 256 colors.
set  -g  default-terminal "tmux-256color"
set  -ga terminal-features ",xterm-256color:RGB"
set  -ga terminal-features ",*:usstyle"          # undercurl for LSP diagnostics

# Neovim needs these: autoread / autosave-on-focus-lost, and fast Esc.
set  -g  focus-events on
set  -sg escape-time 0
set  -g  extended-keys on                        # CSI-u, lets Ctrl+Shift combos through
set  -as terminal-features 'xterm*:extkeys'      # tell tmux iTerm2 can send CSI-u
set  -g  extended-keys-format csi-u              # emit CSI-u, not xterm modifyOtherKeys
set  -g  allow-passthrough on                    # OSC 52 & image passthrough

set -g update-environment "SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION"

# ---------- General ----------
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles off
setw -g mode-keys vi
setw -g automatic-rename on

# ---------- Prefix: C-a ----------
unbind C-b
set -g prefix ^A
bind a send-prefix
bind C-a last-window

# ---------- Reload ----------
bind r source-file ~/.tmux.conf \; display-message " tmux.conf reloaded"

# ---------- Splits (keep CWD) ----------
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ---------- Pane navigation ----------
# Handled by vim-tmux-navigator (see plugins): C-h/j/k/l cross nvim splits
# and tmux panes transparently, without grepping the process name.

# Resize (vi-style, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind tab next-layout
bind R rotate-window
bind space select-pane -t:.+

# ---------- Kill ----------
bind q confirm-before -p "kill pane? (y/n)" kill-pane
bind Q confirm-before -p "kill window? (y/n)" kill-window

# ---------- Copy mode (macOS clipboard) ----------
set -g set-clipboard on
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind p paste-buffer
bind b list-buffers

# ---------- Sync panes ----------
bind e setw synchronize-panes on  \; display-message " panes synchronized"
bind E setw synchronize-panes off \; display-message " panes independent"

# ---------- Activity ----------
setw -g monitor-activity on
set  -g visual-activity off
bind m setw monitor-activity

# ============================================================
#  Status bar — Dracula minimal
# ============================================================

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e1f29,fg=#f8f8f2"

set -g status-left-length 40
set -g status-right-length 90

# session name
set -g status-left "#[fg=#1e1f29,bg=#bd93f9,bold] #S #[fg=#bd93f9,bg=#1e1f29,nobold] "

# windows
setw -g window-status-format         "#[fg=#6272a4] #I #W#{?window_flags,#{window_flags}, } "
setw -g window-status-current-format "#[fg=#1e1f29,bg=#8be9fd,bold] #I #W#{?window_flags,#{window_flags}, } #[fg=#8be9fd,bg=#1e1f29,nobold]"
setw -g window-status-activity-style "fg=#f1fa8c"
setw -g window-status-separator ""

# git branch + clock
set -g status-right "#[fg=#50fa7b]#(cd '#{pane_current_path}' && git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/ /') #[fg=#6272a4]│ #[fg=#bd93f9]%H:%M "

# panes
set -g pane-border-style        "fg=#6272a4"
set -g pane-active-border-style "fg=#bd93f9"
set -g display-panes-colour        "#6272a4"
set -g display-panes-active-colour "#bd93f9"

# messages / copy mode
set -g message-style      "bg=#bd93f9,fg=#1e1f29,bold"
set -g mode-style         "bg=#bd93f9,fg=#1e1f29"
set -g clock-mode-colour  "#bd93f9"

# ============================================================
#  Plugins (TPM)
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect / continuum: sessions survive a reboot
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'
